name: Dependency Canary

# 목적: requirements.txt는 대부분 버전을 고정하지 않아서, Cloudtype이 서버를 새로 빌드하는 순간 그날의 "최신 버전"이 설치된다.
# 라이브러리가 대개편(예: google-genai 3.0)을 내서 우리 코드가 깨져도, 배포해 보기 전에는 알 수 없다.
# 그래서 매일 "지금 새로 빌드하면 설치될 최신 버전"을 똑같이 설치해 테스트를 돌려 두고, 깨지면 이슈로 알린다.
# - 배포(Cloudtype)에는 아무 영향이 없다. 읽기만 하고 아무것도 올리지 않는다.
# - 테스트는 가짜 Gemini와 법제처 접속 없이 돈다(SKIP_ONLINE_TESTS=1). 외부 사정으로 흔들리면 가짜 경보가 되기 때문이다.
# - 실패하면 이슈를 "한 번만" 만든다(열린 이슈가 있으면 새로 만들지 않아 매일 알림이 쌓이지 않는다).
# - 점검 결과가 이상 없어도 google-genai의 큰 버전이 TESTED_MAJOR를 넘으면 "새 대개편 출시"로 알린다.
#   (대응: 로컬에서 새 버전으로 테스트·실제 호출을 확인한 뒤 아래 TESTED_MAJOR를 올린다.)

on:
  schedule:
    - cron: '0 21 * * *' # 매일 06:00 (KST 기준, UTC 21:00)
  workflow_dispatch: # 수동 실행 버튼
  push:
    paths:
      - '.github/workflows/dependency_canary.yml' # 이 파일을 고치면 바로 한 번 돌려 확인한다

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKIP_ONLINE_TESTS: '1'
      TESTED_MAJOR: '2' # google-genai는 2.24~2.34에서 동작을 확인했다

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 개발 PC와 같은 3.11

      - name: Install latest dependencies (Cloudtype 빌드와 같은 방식)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show installed versions
        run: |
          pip freeze | grep -iE '^(google-genai|google-auth|flask|flask-cors|requests|mcp|fastmcp|langchain[a-z-]*|langgraph|pymupdf|pypdf2|gunicorn)==' || true

      - name: Run tests
        run: |
          python test_admrul.py
          python test_gemini_endpoints.py
          python test_duty_text.py
          python test_award.py
          python test_bid_model.py
          python test_rule_engine.py
          python test_law_review_verify.py
          python test_gemini_version.py
          python test_lr_flags.py
          python test_law_review_page.py
          python test_project_docs.py
          python test_parcel_map.py
          for f in test_pq_cm test_pq_design test_pq_engine test_pq_env test_pq_mlit test_pq_mof test_pq_safe test_pq_watch test_injection; do
            echo "--- $f"
            python $f.py
          done

      - name: Check google-genai major version
        run: |
          python - <<'EOF'
          import importlib.metadata as m, os, sys
          v = m.version('google-genai')
          major = int(v.split('.')[0])
          tested = int(os.environ['TESTED_MAJOR'])
          print(f'google-genai 설치 버전: {v} (테스트 확인한 큰 버전: {tested})')
          if major > tested:
              print(f'::error::google-genai {v} 출시 - 큰 버전이 {tested}를 넘었습니다. 로컬에서 테스트와 실제 호출을 확인한 뒤 TESTED_MAJOR를 올리세요.')
              sys.exit(1)
          EOF

      - name: Open an issue on failure (한 번만)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create dependency-canary --color D93F0B --description "최신 의존성에서 테스트 실패 또는 새 대개편 출시" 2>/dev/null || true
          if [ -n "$(gh issue list --label dependency-canary --state open --json number --jq '.[0].number')" ]; then
            echo "이미 열린 dependency-canary 이슈가 있어 새로 만들지 않습니다."
            exit 0
          fi
          VERSIONS="$(pip freeze | grep -iE '^(google-genai|flask|mcp|fastmcp|langchain[a-z-]*|langgraph|pymupdf)==' || true)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create --label dependency-canary \
            --title "의존성 점검 실패: 최신 버전에서 테스트 실패 또는 새 대개편 출시" \
            --body "$(printf '매일 도는 의존성 점검(Dependency Canary)이 실패했습니다.\n\n- 실행 로그: %s\n\n지금 서버를 새로 배포(Cloudtype 빌드)하면 아래 최신 버전이 설치됩니다.\n\n```\n%s\n```\n\n**대응**: 로그에서 어떤 단계가 실패했는지 확인하세요. 테스트 실패라면 이 버전들로는 배포하지 않는 편이 안전하고, requirements.txt에 상한선을 걸어(예: google-genai>=2.24,<3) 임시로 막을 수 있습니다. 새 대개편 출시 알림이라면 로컬에서 테스트와 실제 호출을 확인한 뒤 dependency_canary.yml의 TESTED_MAJOR를 올리세요.\n\n해결되면 이 이슈를 닫아 주세요(닫혀야 다음 실패 때 새 이슈가 만들어집니다).' "$RUN_URL" "$VERSIONS")"
