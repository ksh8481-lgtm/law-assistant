name: Daily Law Crawler

on:
  schedule:
    - cron: '0 18 * * *' # 매일 새벽 3시 (KST 기준, UTC 18:00)
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 크롤링은 보통 10분 안팎 - 응답이 멈춰 1시간 가까이 매달리는 일을 막는다
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Crawler
        run: python -u crawler.py # -u: 로그를 바로바로 출력(중간에 죽어도 어느 법령에서 죽었는지 남도록)

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/laws/
          # 변경사항이 있는 경우에만 커밋
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "chore: 자동 법령 및 별표 크롤링 업데이트"
            # 크롤링하는 동안 다른 커밋이 올라왔어도 push가 거부되지 않게 먼저 합친다
            git pull --rebase origin main
            git push
          fi
